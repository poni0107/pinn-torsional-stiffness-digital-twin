[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-torsional-stiffness-digital-twin"
version = "0.1.0"
description = "Weak-form PINN digital twin for torsional-stiffness identification"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.10.0",
  "numpy==2.0.2",
  "scipy==1.16.0",
  "torch==2.5.1",
]

[project.scripts]
pinn-torsional-twin = "pinn_torsional_twin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pinn_torsional_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

