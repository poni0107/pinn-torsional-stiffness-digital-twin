name: lightweight-ci

on:
  push:
  pull_request:

jobs:
  imports-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Import smoke test
        run: python -c "import pinn_torsional_twin; from pinn_torsional_twin.physics import weak"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Figure-generation smoke test
        run: python scripts/generate_publication_figures.py --check-only
